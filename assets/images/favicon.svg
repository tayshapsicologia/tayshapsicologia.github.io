<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" fill="#0e0e0c" rx="4"/>
  <!-- Centro (nodo principal) -->
  <circle cx="16" cy="16" r="3" fill="#c4a46b"/>
  <!-- Radiaciones (sinápsis) -->
  <line x1="16" y1="16" x2="6"  y2="8"  stroke="#a89f94" stroke-width="1" opacity=".6"/>
  <line x1="16" y1="16" x2="26" y2="8"  stroke="#a89f94" stroke-width="1" opacity=".5"/>
  <line x1="16" y1="16" x2="4"  y2="19" stroke="#a89f94" stroke-width=".8" opacity=".4"/>
  <line x1="16" y1="16" x2="28" y2="20" stroke="#a89f94" stroke-width=".8" opacity=".4"/>
  <line x1="16" y1="16" x2="10" y2="27" stroke="#a89f94" stroke-width=".8" opacity=".35"/>
  <line x1="16" y1="16" x2="22" y2="27" stroke="#a89f94" stroke-width=".8" opacity=".35"/>
  <!-- Nodos secundarios -->
  <circle cx="6"  cy="8"  r="1.2" fill="#a89f94" opacity=".7"/>
  <circle cx="26" cy="8"  r="1.2" fill="#a89f94" opacity=".7"/>
  <circle cx="4"  cy="19" r="1"   fill="#6b6560" opacity=".6"/>
  <circle cx="28" cy="20" r="1"   fill="#6b6560" opacity=".6"/>
  <circle cx="10" cy="27" r="1"   fill="#6b6560" opacity=".5"/>
  <circle cx="22" cy="27" r="1"   fill="#6b6560" opacity=".5"/>
  <!-- Anillo exterior tenue -->
  <circle cx="16" cy="16" r="12" stroke="#a89f94" stroke-width=".4" opacity=".15" fill="none" stroke-dasharray="3 5"/>
</svg>
